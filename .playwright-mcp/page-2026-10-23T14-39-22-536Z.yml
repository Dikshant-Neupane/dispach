            - heading "Models at 125/125, head-to-head" [level=3] [ref=e403]
            - paragraph [ref=e404]: On 25 multi-turn tool tasks run 5 times each, Dispach matches or beats Hermes on 8 of 11 models and costs the least of three harnesses on 10.
            - paragraph [ref=e405]: One benchmark of our own design, each harness on its own defaults. Hermes leads on the two small open models.
            - link "Benchmarks →" [ref=e406] [cursor=pointer]:
              - /url: /docs/runtime/benchmarks
          - article [ref=e407]:
            - paragraph [ref=e408]: "202"
            - heading "Turns outlive the client" [level=3] [ref=e409]
            - paragraph [ref=e410]: A turn is detached from the request that started it. Drop the connection, reattach from any client, and the stream replays from the start.
            - paragraph [ref=e411]: The recording above is that, unedited apart from shortened request bodies.
            - link "Turn lifecycle →" [ref=e412] [cursor=pointer]:
              - /url: /docs/runtime/concepts/turn-lifecycle
          - article [ref=e413]:
            - paragraph [ref=e414]: 91 ms
            - heading "Process start to ready" [level=3] [ref=e415]
            - paragraph [ref=e416]: No network I/O before readiness, by rule. Channels and remote catalogues connect afterwards and report status as events.
            - paragraph [ref=e417]: Median of 7 boots, Apple M4 Pro. Boot, not response latency. CI fails above 1,200 ms.
            - link "Evidence →" [ref=e418] [cursor=pointer]:
              - /url: /evals
          - article [ref=e419]:
            - paragraph [ref=e420]: 178 MiB
            - heading "100 agents, one process" [level=3] [ref=e421]
            - paragraph [ref=e422]: One runtime hosts many agents, and scoped keys fence each off. Adopt and remove agents live, with no restart.
            - paragraph [ref=e423]: Idle resident memory, linux/arm64 image, one machine.
            - link "Evidence →" [ref=e424] [cursor=pointer]:
