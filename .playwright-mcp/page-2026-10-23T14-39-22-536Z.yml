      - generic [ref=e377]:
        - heading "what you don't build" [level=2] [ref=e378]
        - generic [ref=e379]:
          - generic [ref=e380]:
            - term [ref=e381]: Sessions
            - definition [ref=e382]: Every conversation persisted and resumable, keyed however your product keys it.
          - generic [ref=e383]:
            - term [ref=e384]: Memory
            - definition [ref=e385]: Notes and past conversations recalled across sessions, ranked lexically, no vector store.
          - generic [ref=e386]:
            - term [ref=e387]: Tools under a policy
            - definition [ref=e388]: Shell, files, web, MCP and Composio. A policy decides what runs; a floor no rule can lift.
          - generic [ref=e389]:
            - term [ref=e390]: Schedules
            - definition [ref=e391]: Cron, interval and one-shot, DST-correct, delivered through the same outbox as replies.
          - generic [ref=e392]:
            - term [ref=e393]: Channels
            - definition [ref=e394]: Telegram and WhatsApp. Slack, Teams and A2A ship experimental.
          - generic [ref=e395]:
            - term [ref=e396]: Approvals and keys
            - definition [ref=e397]: A human gate on writes over the wire, and keys scoped to one agent or one tenant.
